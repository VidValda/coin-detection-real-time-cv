version: "3.8"

services:
  coin-counter:
    build:
      context: .
      dockerfile: Dockerfile
    image: coin-counter:latest
    container_name: coin_counter
    environment:
      - DISPLAY=${DISPLAY}
      - COIN_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true

  coin-counter-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: coin-counter:latest
    container_name: coin_counter_train
    environment:
      - DISPLAY=${DISPLAY}
      - COIN_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: train_acquisition
    profiles:
      - train
